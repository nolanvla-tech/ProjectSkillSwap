{% extends 'market/base.html' %}
{% block title %}Delete Skill — SkillSwap{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">
            <div class="card text-center">
                <div class="card-body p-5">
                    <div class="mb-4" style="font-size: 2.5rem; color: #ef4444;">
                        <i class="fas fa-trash-alt"></i>
                    </div>
                    <h4 class="fw-bold mb-2">Delete this skill?</h4>
                    <p class="text-muted mb-1" style="font-size: 0.9rem;">
                        You're about to permanently delete <strong>"{{ skill.title }}"</strong>.
                    </p>
                    <p class="text-muted mb-4" style="font-size: 0.85rem;">This cannot be undone.</p>

                    <form method="post">
                        {% csrf_token %}
                        <div class="d-flex gap-2 justify-content-center">
                            <a href="{% url 'market:dashboard' %}" class="btn btn-outline-secondary px-4">Cancel</a>
                            <button type="submit" class="btn btn-danger px-4">Delete</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
