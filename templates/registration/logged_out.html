{% extends 'market/base.html' %}
{% block title %}Logged Out — SkillSwap{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4 text-center">
            <div class="card">
                <div class="card-body p-5">
                    <div class="mb-4" style="font-size: 2rem; color: var(--primary);">
                        <i class="fas fa-check-circle"></i>
                    </div>
                    <h4 class="fw-bold mb-2">You've been logged out</h4>
                    <p class="text-muted mb-4" style="font-size: 0.9rem;">Thanks for using SkillSwap. See you next time!</p>
                    <div class="d-grid gap-2">
                        <a href="{% url 'login' %}" class="btn btn-primary fw-semibold">Sign In Again</a>
                        <a href="{% url 'market:home' %}" class="btn btn-outline-secondary fw-semibold">Browse Skills</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
