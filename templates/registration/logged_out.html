{% extends 'market/base.html' %}

{% block title %}Logged Out - Campus SkillSwap{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card border-0 shadow-sm">
                <div class="card-header bg-white border-0 pt-5 pb-4" style="padding-top: 2.5rem !important; padding-bottom: 1.5rem !important;">
                    <h2 class="display-5 fw-bold mb-3" style="font-size: 2rem;"><i class="fas fa-sign-out-alt me-2" style="color: #6366f1;"></i>Logged Out</h2>
                </div>
                
                <div class="card-body" style="padding: 3rem;">
                    <div class="alert alert-success" role="alert">
                        <i class="fas fa-check-circle me-2"></i>
                        You have been successfully logged out.
                    </div>
                    
                    <p class="text-muted mb-4">Thanks for using Campus SkillSwap! See you next time.</p>
                    
                    <div class="d-grid gap-2">
                        <a href="{% url 'login' %}" class="btn btn-primary" style="padding: 0.85rem; font-weight: 600; font-size: 1rem;">
                            <i class="fas fa-sign-in-alt me-2"></i>Log In Again
                        </a>
                        <a href="{% url 'market:home' %}" class="btn btn-outline-primary" style="padding: 0.85rem; font-weight: 600; font-size: 1rem;">
                            <i class="fas fa-home me-2"></i>Return Home
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
